<!DOCTYPE html>
<html>
<head>
    <title>Sitara Chemicals Cafe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #eef2f8;
            text-align: center;
        }

        .header {
            background-color: #1a3a7a;
            color: white;
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .logo-star {
            width: 55px;
            height: 55px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-star span {
            color: #1a3a7a;
            font-size: 34px;
            line-height: 1;
        }

        .brand {
            text-align: left;
        }

        .brand h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .brand p {
            margin: 3px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            padding: 50px;
        }

        .card {
            background-color: white;
            width: 340px;
            margin: auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #1a3a7a;
        }

        .card p {
            color: #444;
            line-height: 1.5;
        }

        a {
            text-decoration: none;
        }

        button {
            background-color: #1a3a7a;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #274d99;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo-star">
            <span>★</span>
        </div>
        <div class="brand">
            <h1>SITARA CHEMICAL INDUSTRIES</h1>
            <p>Cafe Management System</p>
        </div>
    </div>

    <div class="container">

        <div class="card">
            <h2>Welcome! ⭐</h2>

            <p>
                Welcome to the Sitara Chemical Industries
                Cafe Management System.
            </p>

            <a href="/login"><button>Get Started</button></a>
        </div>

    </div>

</body>
</html>
