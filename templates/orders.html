<!DOCTYPE html>
<html>
<head>
    <title>Order History - Sitara Chemicals Cafe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #eef2f8;
            text-align: center;
        }

        .header {
            background-color: #1a3a7a;
            color: white;
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .logo-star {
            width: 55px; height: 55px; background-color: white;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0;
        }
        .logo-star span { color: #1a3a7a; font-size: 34px; line-height: 1; }

        .brand { text-align: left; }
        .brand h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
        .brand p { margin: 3px 0 0 0; font-size: 14px; opacity: 0.9; }

        .container { padding: 30px; }

        .card {
            background-color: white;
            width: 90%;
            max-width: 900px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card h2 { color: #1a3a7a; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: #1a3a7a;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover { background-color: #eef2f8; }

        .total { font-weight: bold; color: #1a3a7a; }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #1a3a7a;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo-star"><span>★</span></div>
        <div class="brand">
            <h1>SITARA CHEMICAL INDUSTRIES</h1>
            <p>Cafe Management System</p>
        </div>
    </div>

    <div class="container">

        <div class="card">

            <h2>📋 Order History</h2>

            <table>
                <tr>
                    <th>Customer</th>
                    <th>Tea</th>
                    <th>Coffee</th>
                    <th>Sandwich</th>
                    <th>Burger</th>
                    <th>Total</th>
                </tr>

                {% for order in orders %}
                <tr>
                    <td>{{ order[1] }}</td>
                    <td>{{ order[2] }}</td>
                    <td>{{ order[3] }}</td>
                    <td>{{ order[4] }}</td>
                    <td>{{ order[5] }}</td>
                    <td class="total">₹{{ order[6] }}</td>
                </tr>
                {% endfor %}

            </table>

            <a href="/menu" class="back-link">← Back to Menu</a>
            <a href="/dashboard" class="back-link" style="margin-left: 20px;">🏠 Dashboard</a>

        </div>

    </div>

</body>
</html>
