<!DOCTYPE html>
<html>
<head>
    <title>Edit Menu - Sitara Chemicals Cafe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #eef2f8;
            text-align: center;
        }

        .header {
            background-color: #1a3a7a;
            color: white;
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .logo-star {
            width: 55px; height: 55px; background-color: white;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0;
        }
        .logo-star span { color: #1a3a7a; font-size: 34px; line-height: 1; }

        .brand { text-align: left; }
        .brand h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
        .brand p { margin: 3px 0 0 0; font-size: 14px; opacity: 0.9; }

        .container { padding: 30px; }

        .success-banner {
            background-color: #e8f5e9;
            border: 1px solid #a5d6a7;
            color: #1b5e20;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            max-width: 500px;
            margin: 0 auto 20px auto;
        }

        table {
            width: 95%;
            max-width: 900px;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        th {
            background-color: #1a3a7a;
            color: white;
            padding: 14px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .day-name {
            font-weight: bold;
            color: #1a3a7a;
            text-align: left;
        }

        input[type="text"] {
            width: 95%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            margin-top: 25px;
            background-color: #1a3a7a;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover { background-color: #274d99; }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            margin-left: 20px;
            color: #1a3a7a;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo-star"><span>★</span></div>
        <div class="brand">
            <h1>SITARA CHEMICAL INDUSTRIES</h1>
            <p>Edit Weekly Menu (Admin)</p>
        </div>
    </div>

    <div class="container">

        {% if success %}
            <div class="success-banner">✅ {{ success }}</div>
        {% endif %}

        <form method="POST" action="/edit_menu">

            <table>
                <tr>
                    <th>Day</th>
                    <th>🌅 Breakfast</th>
                    <th>🌞 Lunch</th>
                    <th>🌙 Dinner</th>
                </tr>

                {% for day in ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"] %}
                <tr>
                    <td class="day-name">{{ day }}</td>
                    <td><input type="text" name="{{ day }}_breakfast" value="{{ menu[day].Breakfast }}" required></td>
                    <td><input type="text" name="{{ day }}_lunch" value="{{ menu[day].Lunch }}" required></td>
                    <td><input type="text" name="{{ day }}_dinner" value="{{ menu[day].Dinner }}" required></td>
                </tr>
                {% endfor %}

            </table>

            <button type="submit">💾 Save Menu</button>
            <a href="/dashboard" class="back-link">← Back to Dashboard</a>

        </form>

    </div>

</body>
</html>
